name: Deploy the Grasp Lab viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the viewer
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the published viewer
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          site="${SITE_URL%/}"
          viewer_index="$RUNNER_TEMP/grasp-lab-index.html"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-max-time 60 --max-time 15 "$site/" --output "$viewer_index"
          viewer_asset="$(sed -nE 's/.*src="(\.\/assets\/[^"]+\.js)".*/\1/p' "$viewer_index")"
          test -n "$viewer_asset"
          curl --fail --silent --show-error --location --max-time 15 "$site/${viewer_asset#./}" --output /dev/null
          curl --fail --silent --show-error --location --max-time 15 "$site/data/report.json" |
            jq --exit-status '.widths | type == "array" and length > 0' >/dev/null
          echo "Verified the published viewer and benchmark data at $site/"
